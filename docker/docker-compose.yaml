services:
  anyadmin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: anyadmin:latest
    container_name: anyadmin
    ports:
      - "${PORT:-3000}:3000"
      - "${MgmtPort:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MgmtPort=8080
      - MgmtHost=0.0.0.0
    env_file:
      - ../.env
    volumes:
      - ../tars:/home/anyadmin/app/backend/deployments/tars
      - ../logs:/home/anyadmin/logs
      - ../data.json:/home/anyadmin/app/backend/data.json
      - ../keys:/home/anyadmin/app/backend/keys
      - ../.env:/home/anyadmin/app/.env
    restart: unless-stopped

