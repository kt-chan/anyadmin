networks:
  # Fixed name allows multiple projects to share the same network
  genai-network:
    name: genai-network
    driver: bridge

services:
  # LiteLLM Proxy Gateway: Unified entry point for all models
  litellm:
    image: ghcr.io/berriai/litellm:1.81.14
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]
    networks:
      - genai-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/readiness\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Generic vLLM service for dynamic deployment
  # Reused for all LLM instances via Docker Compose projects (-p)
  vllm-llm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["llm"]
    shm_size: '4gb'
    ports:
      - "${VLLM_LLM_PORT:-8000}:8000"
    volumes:
      - ${VLLM_MODEL_PATH:-/home/anyadmin/data/model}:/model
    entrypoint: python3 -m vllm.entrypoints.openai.api_server
    command: >
      --model /model/${VLLM_MODEL_NAME:-Qwen3-1.7B}
      --served-model-name ${VLLM_SERVED_MODEL_NAME:-model}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-4096}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-8}
      --max-num-batched-tokens ${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        # GPU Reservation: Dynamically allocated via environment
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICE_ID:-0}']
              capabilities: [gpu]
    networks:
      genai-network:
        # Use a predictable alias for LiteLLM routing
        aliases:
          - ${VLLM_NETWORK_ALIAS:-vllm-instance}

  vllm-mineru:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["mineru"]
    shm_size: '4gb'
    ports:
      - "${VLLM_MINERU_PORT:-8000}:8000"
    volumes:
      - ${VLLM_MODEL_PATH:-/home/anyadmin/data/model}:/model
    entrypoint: python3 -m vllm.entrypoints.openai.api_server
    command: >
      --model /model/${MINERU_VLLM_MODEL_NAME:-MinerU-2.5}
      --served-model-name ${MINERU_VLLM_MODEL_NAME:-MinerU-2.5}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-4096}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-8}
      --max-num-batched-tokens ${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - genai-network

  vllm-embedding:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["embedding"]
    shm_size: '4gb'
    ports:
      - "${VLLM_EMBEDDING_PORT:-8000}:8000"
    volumes:
      - ${VLLM_MODEL_PATH:-/home/anyadmin/data/model}:/model
    entrypoint: python3 -m vllm.entrypoints.openai.api_server
    command:
      - "--model"
      - "/model/${VLLM_EMBEDDING_MODEL_NAME:-bge-large-zh}"
      - "--served-model-name"
      - "${VLLM_EMBEDDING_MODEL_NAME:-bge-large-zh}"
      - "--task"
      - "embed"
      - "--max-model-len"
      - "${VLLM_EMBEDDING_MAX_MODEL_LEN:-4096}"
      - "--max-num-seqs"
      - "${VLLM_EMBEDDING_MAX_NUM_SEQS:-8}"
      - "--max-num-batched-tokens"
      - "${VLLM_EMBEDDING_MAX_NUM_BATCHED_TOKENS:-8192}"
      - "--gpu-memory-utilization"
      - "${VLLM_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.85}"
      - "--host"
      - "0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    networks:
      - genai-network

  anythingllm:
    image: ${ANYTHINGLLM_IMAGE:-mintplexlabs/anythingllm:1.8.5}
    profiles: ["rag"]
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    environment:
      - SERVER_PORT=${ANYTHINGLLM_PORT:-3001}
      - STORAGE_DIR=${ANYTHINGLLM_STORAGE_DIR:-/app/server/storage}
      - LLM_PROVIDER=${LLM_PROVIDER:-generic-openai}
      - GENERIC_OPEN_AI_BASE_PATH=${GENERIC_OPEN_AI_BASE_PATH:-http://litellm:4000/v1}
      - GENERIC_OPEN_AI_MODEL_PREF=${GENERIC_OPEN_AI_MODEL_PREF:-qwen}
      - GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT=${GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT:-4098}
      - GENERIC_OPEN_AI_MAX_TOKENS=${GENERIC_OPEN_AI_MAX_TOKENS:-2048}
      - GENERIC_OPEN_AI_API_KEY=${GENERIC_OPEN_AI_API_KEY:-AnyThing0f02d8295easdfadsaQBr0uz3sHAAb}
      - VECTOR_DB=${VECTOR_DB:-lancedb}
    volumes:
      - ${ANYTHINGLLM_DATA_PATH:-/home/anyadmin/data/anythingllm}/storage:/app/server/storage
    ports:
      - "${ANYTHINGLLM_PORT:-3001}:${ANYTHINGLLM_PORT:-3001}"
    networks:
      - genai-network

  mineru-api:
    image: mineru-client:2.7.6
    profiles: ["mineru"]
    ports:
      - "${MINERU_PORT:-8010}:8000"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 8000
    networks:
      - genai-network
